version: '3.8'

services:
  backend:
    build:
      context: ./EXTRUTURA
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      # As variáveis de ambiente do Coolify são injetadas diretamente na UI do painel
    volumes:
      # Persistir ficheiros da base de dados local, logs e credenciais entre reinícios e atualizações
      - app-data:/app/db
      - app-logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # As variáveis de compilação do React são recebidas das Environment Variables do Coolify
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
  app-logs:
